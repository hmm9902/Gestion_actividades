services:
  # Backend API - FastAPI Python
  - type: web
    name: gestion-actividades-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: ACTIVE_DB_PROVIDER
        value: TURSO
      - key: TURSO_DATABASE_URL
        value: https://gestor-actividades-anarchy9902.aws-us-east-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USER
        value: ADMIN
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: Admin123*Seguro
      - key: CORS_ORIGINS
        value: "*"

  # Frontend Web - React + Vite SPA
  - type: web
    name: GlobalWeb
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: gestion-actividades-api
          property: url
          format: ${property}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
